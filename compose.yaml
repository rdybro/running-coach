services:
  frontend:
    image: ghcr.io/rdybro/running-coach-frontend:latest
    build: ./frontend
    container_name: running-coach-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - running-coach

  api:
    image: ghcr.io/rdybro/running-coach-api:latest
    build: ./api
    container_name: running-coach-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/database.db
    volumes:
      - ./data:/data
    networks:
      - running-coach

networks:
  running-coach:
    name: running-coach
    driver: bridge