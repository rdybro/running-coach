services:
  frontend:
    image: ghcr.io/rdybro/running-coach-frontend:latest
    container_name: running-coach-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - running-coach

  api:
    image: ghcr.io/rdybro/running-coach-api:latest
    container_name: running-coach-api
    restart: unless-stopped
    environment:
      GARMIN_API_KEY: 'abc'
      OPENAI_API_KEY: 'def'
      OPENAI_BASE_URL: 'ghi'
      OPENAI_MODEL: 'mistral-small-3.2-24b-instruct-2506'
      DB_PATH: /data/database.db
    volumes:
      - ./data:/data
    networks:
      - running-coach

networks:
  running-coach:
    name: running-coach
    driver: bridge